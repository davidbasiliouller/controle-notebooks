<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de notebooks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f6; --ink:#16212e; --muted:#5b6b7c; --line:#c5d0dc;
    --blue:#0a3d7a; --green:#1f8a4c; --red:#c0392b;
  }
  body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;padding-bottom:7rem}
  .app{max-width:760px;margin:0 auto;padding:1.25rem 1rem}
  h1{font-size:1.5rem;font-weight:700;margin:0}
  h2{font-size:1.05rem;font-weight:700;margin:0}
  .sub{color:var(--muted);margin:.15rem 0 1rem}
  label{font-weight:700;margin-bottom:.25rem}
  .form-control{border:2px solid var(--line);border-radius:.5rem;padding:.6rem .75rem;font-size:1rem}
  .form-control:focus{border-color:var(--blue);box-shadow:0 0 0 .2rem rgba(10,61,122,.2)}

  .seg{display:grid;grid-template-columns:1fr 1fr;background:#dfe6ee;border-radius:.6rem;padding:.25rem;margin-bottom:1.25rem}
  .seg button{border:0;background:transparent;padding:.7rem;border-radius:.45rem;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.15)}

  .grid-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin:1.25rem 0 .6rem;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:.5rem}
  .tile{border:2px solid var(--line);background:#fff;border-radius:.5rem;min-height:60px;padding:.4rem .25rem;
        display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;
        font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;color:var(--ink)}
  .tile small{font-weight:400;font-size:.72rem;color:var(--muted)}
  .tile.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .tile.on small{color:#d3e3f6}
  .tile.ok{background:#e8f5ee;border-color:var(--green);color:#14633a}
  .tile.ok small{color:#14633a}
  .tile.bad{background:var(--red);border-color:var(--red);color:#fff}
  .tile.bad small{color:#fde3df}
  button:focus-visible{outline:3px solid #f2b705;outline-offset:2px}

  .aberta{width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:.6rem;padding:.75rem .9rem;margin-bottom:.5rem}
  .aberta.on{border-color:var(--blue);background:#eaf1fa}
  .aberta b{display:block}
  .aberta span{color:var(--muted);font-size:.92rem}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:.75rem 1rem;z-index:10}
  .bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .bar .btn{background:var(--blue);border-color:var(--blue);font-weight:700;padding:.7rem 1.2rem;white-space:nowrap}
  .bar .btn:disabled{background:#93a4b8;border-color:#93a4b8}
  .link{border:2px solid var(--line);background:#fff;border-radius:.5rem;padding:.35rem .7rem;font-weight:700;color:var(--blue)}
  .done{background:#fff;border:2px solid var(--green);border-radius:.75rem;padding:1.5rem;text-align:center}
  .done .n{font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
  .alert{margin-top:1rem}
  @media (prefers-reduced-motion:no-preference){.tile,.aberta{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<main class="app">
  <h1>Controle de notebooks</h1>
  <p class="sub">Registre no início e no fim da aula.</p>
  <div id="demo" class="alert alert-warning" hidden>Modo demonstração: nada é gravado. Configure a URL do Apps Script em <code>API_URL</code>.</div>

  <div class="seg" role="tablist" aria-label="Momento da aula">
    <button type="button" role="tab" data-mode="retirada" class="on">Início da aula</button>
    <button type="button" role="tab" data-mode="devolucao">Fim da aula</button>
  </div>

  <div id="erro" class="alert alert-danger" role="alert" hidden></div>

  <!-- Início da aula -->
  <section id="v-retirada">
    <div class="row g-3">
      <div class="col-md-6">
        <label for="docente">Docente</label>
        <input id="docente" class="form-control" autocomplete="name" placeholder="Nome do docente">
      </div>
      <div class="col-md-6">
        <label for="turma">Turma</label>
        <input id="turma" class="form-control" placeholder="Ex.: Desenvolvimento de Sistemas">
      </div>
    </div>
    <div class="grid-head">
      <h2>Notebooks retirados (patrimônio)</h2>
      <div class="d-flex gap-2">
        <button type="button" class="link" id="btnTodos">Marcar todos</button>
        <button type="button" class="link" id="btnLimpar">Limpar</button>
      </div>
    </div>
    <div id="grid-retirada" class="grid"></div>
  </section>

  <!-- Fim da aula -->
  <section id="v-devolucao" hidden>
    <h2 class="mb-2">Quem está devolvendo? <small id="sync" class="text-muted fw-normal" hidden>atualizando…</small></h2>
    <div id="abertas"></div>
    <div id="detalhe" hidden>
      <div class="grid-head">
        <h2>Toque só nos que deram problema</h2>
        <button type="button" class="link" id="btnTudoOk">Tudo certo</button>
      </div>
      <div id="grid-devolucao" class="grid"></div>
      <div class="mt-3">
        <label for="obs">Observação <span id="obsReq" class="text-muted fw-normal"></span></label>
        <textarea id="obs" class="form-control" rows="2" placeholder="O que aconteceu com o notebook?"></textarea>
      </div>
    </div>
  </section>

  <section id="done" class="done" hidden>
    <h2 id="doneTitulo">Registrado</h2>
    <p class="mb-1">No gabinete agora</p>
    <div class="n"><span id="doneSaldo">0</span> de <span id="doneTotal">0</span></div>
    <button type="button" class="btn btn-outline-primary mt-3" id="btnNovo">Novo registro</button>
  </section>
</main>

<div class="bar" id="bar">
  <div class="bar-in">
    <div id="resumo" aria-live="polite"></div>
    <button type="button" class="btn btn-primary" id="enviar">Registrar retirada</button>
  </div>
</div>

<script>
/* ====== CONFIGURAÇÃO ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxXTz59IViBHdi2YgWvlb0TQ-B5ou6b84j9Gn-6Ynvft7P6DhQzpCS1SO_NW0VMlNCJ6A/exec'; 
const API_KEY = '';                                
/* ========================== */

const DEMO = API_URL.startsWith('COLE_AQUI');
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const natural = (a, b) => a.localeCompare(b, 'pt-BR', { numeric: true });
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  mode: 'retirada', notebooks: [], selected: new Set(),
  abertas: [], escolhida: null, problemas: new Set(), sending: false
};

/* ---------- API ---------- */
async function api(action) {
  if (DEMO) return demoGet(action);
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  if (API_KEY) url.searchParams.set('key', API_KEY);
  let ultimo;
  for (let t = 0; t < 2; t++) {            // 1 nova tentativa se o Google devolver página de erro
    try {
      const r = await fetch(url);
      const txt = await r.text();
      let d; try { d = JSON.parse(txt); } catch (x) { throw new Error('O Google devolveu uma resposta inesperada. Tente novamente.'); }
      if (!d.ok) throw new Error(d.error || 'Erro ao consultar a planilha');
      return d;
    } catch (e) { ultimo = e; if (e.message && !e.message.includes('inesperada') && !(e instanceof TypeError)) break; await sleep(800); }
  }
  throw ultimo;
}
async function enviar(payload) {
  if (DEMO) { await sleep(500); return demoPost(payload); }
  if (API_KEY) payload.key = API_KEY;
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS
    body: JSON.stringify(payload)
  });
  const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch (x) { throw new Error('O Google devolveu uma resposta inesperada. Confira na planilha se o registro entrou antes de repetir.'); }
  if (!d.ok) throw new Error(d.error || 'Erro ao gravar na planilha');
  return d;
}

/* ---------- Demo (sem planilha) ---------- */
const demoDB = {
  notebooks: Array.from({ length: 30 }, (_, i) => String(101 + i).padStart(4, '0')),
  abertas: [{ docente: 'Prof. Exemplo', turma: 'DS-2025', patrimonios: ['0103', '0104', '0107', '0110'], quando: new Date().toISOString() }]
};
function demoGet(a) {
  if (a === 'inicio') return { ok: true, notebooks: [...demoDB.notebooks], abertas: demoDB.abertas.map(x => ({ ...x })) };
  if (a === 'lista') return { ok: true, notebooks: [...demoDB.notebooks] };
  if (a === 'abertas') return { ok: true, abertas: demoDB.abertas.map(x => ({ ...x })) };
  throw new Error('Ação inválida');
}
function demoPost(p) {
  const total = demoDB.notebooks.length;
  if (p.tipo === 'Retirada') demoDB.abertas.push({ docente: p.docente, turma: p.turma, patrimonios: p.patrimonios, quando: new Date().toISOString() });
  else demoDB.abertas = demoDB.abertas.filter(a => !(a.docente === p.docente && a.turma === p.turma));
  const fora = new Set(demoDB.abertas.flatMap(a => a.patrimonios));
  (p.problemas || []).forEach(x => fora.add(x));
  return { ok: true, total, saldo: total - fora.size };
}

/* ---------- Render ---------- */
function render() {
  const ret = state.mode === 'retirada';
  $('#v-retirada').hidden = !ret;
  $('#v-devolucao').hidden = ret;
  document.querySelectorAll('.seg button').forEach(b => {
    const on = b.dataset.mode === state.mode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on);
  });

  const total = state.notebooks.length;
  if (ret) {
    $('#grid-retirada').innerHTML = state.notebooks.map(p => {
      const on = state.selected.has(p);
      return `<button type="button" class="tile ${on ? 'on' : ''}" data-p="${esc(p)}" aria-pressed="${on}">${esc(p)}<small>${on ? 'retirado' : 'no gabinete'}</small></button>`;
    }).join('');
    const n = state.selected.size;
    $('#resumo').innerHTML = `<b>${n}</b> retirados<br><small class="text-muted">No gabinete: <b>${total - n}</b> de ${total}</small>`;
  } else {
    $('#abertas').innerHTML = state.abertas.length
      ? state.abertas.map((a, i) => `<button type="button" class="aberta ${state.escolhida === a ? 'on' : ''}" data-i="${i}">
          <b>${esc(a.docente)}</b><span>${esc(a.turma)} · ${a.patrimonios.length} notebooks · desde ${hora(a.quando)}</span></button>`).join('')
      : `<p class="text-muted">Nenhuma retirada em aberto. Registre primeiro o início da aula.</p>`;
    const e = state.escolhida;
    $('#detalhe').hidden = !e;
    if (e) {
      $('#grid-devolucao').innerHTML = e.patrimonios.map(p => {
        const bad = state.problemas.has(p);
        return `<button type="button" class="tile ${bad ? 'bad' : 'ok'}" data-p="${esc(p)}" aria-pressed="${bad}">${esc(p)}<small>${bad ? 'problema' : 'ok'}</small></button>`;
      }).join('');
      const pr = state.problemas.size;
      $('#obsReq').textContent = pr ? '(obrigatória)' : '(opcional)';
      $('#resumo').innerHTML = `<b>${e.patrimonios.length - pr}</b> ok · <b>${pr}</b> com problema`;
    } else {
      $('#resumo').innerHTML = '<small class="text-muted">Escolha quem está devolvendo</small>';
    }
  }
  const btn = $('#enviar');
  btn.textContent = state.sending ? 'Enviando…' : (ret ? 'Registrar retirada' : 'Registrar devolução');
  btn.disabled = state.sending || !podeEnviar();
}

function podeEnviar() {
  if (state.mode === 'retirada') return $('#docente').value.trim() && $('#turma').value.trim() && state.selected.size > 0;
  return !!state.escolhida && (state.problemas.size === 0 || $('#obs').value.trim());
}
function hora(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function showErr(m) { const e = $('#erro'); e.textContent = m; e.hidden = false; }
function hideErr() { $('#erro').hidden = true; }

/* ---------- Ações ---------- */
const chaveDe = a => a.docente + '|' + a.turma;
let atualizando = false;
// Mostra o que já está em memória na hora e atualiza em segundo plano, sem apagar a seleção
async function atualizarAbertas() {
  if (atualizando) return;
  atualizando = true; $('#sync').hidden = false;
  try {
    const novas = (await api('abertas')).abertas;
    const escolhidaKey = state.escolhida && chaveDe(state.escolhida);
    state.abertas = novas;
    state.escolhida = escolhidaKey ? (novas.find(a => chaveDe(a) === escolhidaKey) || null) : null;
    if (!state.escolhida) state.problemas.clear();
    hideErr();
  } catch (e) {
    showErr('Não consegui atualizar as retiradas em aberto. ' + e.message);
  } finally {
    atualizando = false; $('#sync').hidden = true; render();
  }
}

async function registrar() {
  state.sending = true; hideErr(); render();
  try {
    let payload;
    if (state.mode === 'retirada') {
      payload = { tipo: 'Retirada', docente: $('#docente').value.trim(), turma: $('#turma').value.trim(),
                  patrimonios: [...state.selected].sort(natural), obs: '' };
    } else {
      payload = { tipo: 'Devolução', docente: state.escolhida.docente, turma: state.escolhida.turma,
                  problemas: [...state.problemas].sort(natural), obs: $('#obs').value.trim() };
    }
    const res = await enviar(payload);
    if (payload.tipo === 'Retirada') {
      state.abertas.push({ docente: payload.docente, turma: payload.turma, patrimonios: payload.patrimonios, quando: new Date().toISOString() });
    } else {
      state.abertas = state.abertas.filter(a => chaveDe(a) !== chaveDe(payload));
    }
    $('#doneTitulo').textContent = state.mode === 'retirada' ? 'Retirada registrada' : 'Devolução registrada';
    $('#doneSaldo').textContent = res.saldo;
    $('#doneTotal').textContent = res.total;
    ['#v-retirada', '#v-devolucao', '.seg', '#bar'].forEach(s => $(s).hidden = true);
    $('#done').hidden = false;
  } catch (e) {
    showErr(e.message);
  } finally {
    state.sending = false; render();
  }
}

function novo() {
  state.selected.clear(); state.problemas.clear(); state.escolhida = null; $('#obs').value = '';
  $('#docente').value = ''; $('#turma').value = '';
  ['.seg', '#bar'].forEach(s => $(s).hidden = false);
  $('#done').hidden = true;
  render();
  if (state.mode === 'devolucao') atualizarAbertas();
}

/* ---------- Eventos ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode; hideErr();
  render();                                   // troca instantânea com os dados em memória
  if (state.mode === 'devolucao') atualizarAbertas();
}));
$('#grid-retirada').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const p = t.dataset.p; state.selected.has(p) ? state.selected.delete(p) : state.selected.add(p); render();
});
$('#btnTodos').onclick = () => { state.notebooks.forEach(p => state.selected.add(p)); render(); };
$('#btnLimpar').onclick = () => { state.selected.clear(); render(); };
$('#abertas').addEventListener('click', e => {
  const b = e.target.closest('.aberta'); if (!b) return;
  state.escolhida = state.abertas[+b.dataset.i]; state.problemas.clear(); $('#obs').value = ''; render();
});
$('#grid-devolucao').addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const p = t.dataset.p; state.problemas.has(p) ? state.problemas.delete(p) : state.problemas.add(p); render();
});
$('#btnTudoOk').onclick = () => { state.problemas.clear(); render(); };
['#docente', '#turma', '#obs'].forEach(s => $(s).addEventListener('input', render));
$('#enviar').onclick = registrar;
$('#btnNovo').onclick = novo;

/* ---------- Início ---------- */
(async function init() {
  if (DEMO) $('#demo').hidden = false;
  try {
    const d = await api('inicio');          // lista + retiradas em aberto numa só chamada
    state.notebooks = d.notebooks.sort(natural);
    state.abertas = d.abertas || [];
  } catch (e) { showErr('Não consegui carregar a lista de notebooks. ' + e.message); }
  if (!state.notebooks.length && !$('#erro').textContent) showErr('A aba "Notebooks" da planilha está vazia.');
  render();
})();
</script>
</body>
</html>
